<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ShopEase - Products</title><link rel="stylesheet" href="/styles.css"><script src="/app.js"></script></head>
<body>
<main>
  <h1>Avaliable Products</h1>
  <div class="card search-row">
    <input id="search" placeholder="Search products" aria-label="Search products">
    <button id="search-btn">Search</button>
  </div>
  <p id="result-info"></p>
  <!-- SEEDED BROKEN LINK: the Laptop Pro 14 spec sheet PDF was never uploaded (404) -->
  <div id="product-list" class="products"></div>
</main>
<script>
  async function load(q = '') {
    const products = await (await fetch('/api/products?q=' + encodeURIComponent(q))).json();
    document.getElementById('result-info').textContent = products.length ? products.length + ' product(s) found' : 'No products found';
    document.getElementById('product-list').innerHTML = products.map((p) => `
      <div class="product" data-testid="product-card">
        <h3>${p.name}</h3>
        <div>${money(p.price)}</div>
        ${p.id === 1 ? '<a href="/downloads/laptop-pro-14-specs.pdf" style="font-size:13px">Spec sheet (PDF)</a>' : ''}
        <button data-id="${p.id}">Add to cart</button>
      </div>`).join('');
  }
  document.getElementById('search-btn').addEventListener('click', () => load(document.getElementById('search').value));
  document.getElementById('product-list').addEventListener('click', async (e) => {
    if (!e.target.dataset.id) return;
    const res = await fetch('/api/cart/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ productId: e.target.dataset.id }) });
    const data = await res.json();
    if (res.ok) Cart.add(data.product);
  });
  load();
</script>
</body>
</html>
